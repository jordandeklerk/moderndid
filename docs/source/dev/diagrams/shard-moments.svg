<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 880 556" role="img" aria-labelledby="dg-moments-title dg-moments-desc">
  <title id="dg-moments-title">Inference from sums over units</title>
  <desc id="dg-moments-desc">Each shard keeps one row of influence functions, cohort weights, and a constant for each of its units. It returns only the sum of their products and, in a fit that draws, the bootstrap sums. The driver adds the shards' sums and gets the variance of any aggregation from them.</desc>
