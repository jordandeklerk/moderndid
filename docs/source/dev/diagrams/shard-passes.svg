    <symbol id="dg-passes-sigma-32" viewBox="-8.4 -8.4 44.8 44.8"><path d="M21.5 5H8.5l7 9-7 9h13"/></symbol>
    <symbol id="dg-passes-task-32" viewBox="-8.4 -8.4 44.8 44.8"><path d="M9.5 7.5h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2ZM12 12h4v4h-4ZM11.5 4v3.5M16.5 4v3.5M11.5 20.5V24M16.5 20.5V24M4 11.5h3.5M4 16.5h3.5M20.5 11.5H24M20.5 16.5H24"/></symbol>
  </defs>
