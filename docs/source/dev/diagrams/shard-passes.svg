  <use class="dg-glyph" href="#dg-passes-task-32" x="40" y="132" width="32" height="32"/>
  <text class="dg-name" x="84" y="145"><tspan class="dg-num">01</tspan> Summary pass</text>
  <text class="dg-note" x="84" y="161">what every fit needs</text>
  <text class="dg-note" x="84" y="177">before its first iteration</text>
  <rect class="dg-compute dg-tile" x="40" y="216" width="32" height="32" rx="4"/>
  <use class="dg-glyph" href="#dg-passes-task-32" x="40" y="216" width="32" height="32"/>
  <text class="dg-name" x="84" y="229"><tspan class="dg-num">02</tspan> Logit passes</text>
  <text class="dg-note" x="84" y="245">one per iteration</text>
  <text class="dg-note" x="84" y="261">of the logits</text>
  <rect class="dg-compute dg-tile" x="40" y="348" width="32" height="32" rx="4"/>
  <use class="dg-glyph" href="#dg-passes-task-32" x="40" y="348" width="32" height="32"/>
  <text class="dg-name" x="84" y="361"><tspan class="dg-num">03</tspan> Cell sums pass</text>
  <text class="dg-note" x="84" y="377">every cell's effect</text>
  <text class="dg-note" x="84" y="393">at the final fits</text>
  <rect class="dg-compute dg-tile" x="40" y="432" width="32" height="32" rx="4"/>
  <use class="dg-glyph" href="#dg-passes-task-32" x="40" y="432" width="32" height="32"/>
  <text class="dg-name" x="84" y="445"><tspan class="dg-num">04</tspan> Moments pass</text>
  <text class="dg-note" x="84" y="461">for the standard errors</text>
  <text class="dg-note" x="84" y="477">and the bootstrap</text>
  <rect class="dg-driver dg-r-box" x="232" y="68" width="172" height="64" rx="4"/>
  <text class="dg-body" x="244" y="96">plan the cells</text>
  <text class="dg-body" x="244" y="112">and the shared fits</text>
  <rect class="dg-driver dg-r-box" x="232" y="168" width="172" height="48" rx="4"/>
  <text class="dg-body" x="244" y="188">keep independent covariates</text>
  <text class="dg-body" x="244" y="204">and solve the regressions</text>
  <rect class="dg-driver dg-r-box" x="232" y="252" width="172" height="96" rx="4"/>
  <text class="dg-body" x="244" y="296">take a Newton step</text>
  <text class="dg-body" x="244" y="312">until the deviance settles</text>
  <rect class="dg-driver dg-r-box" x="232" y="384" width="172" height="48" rx="4"/>
  <text class="dg-body" x="244" y="404">compute the effects,</text>
  <text class="dg-body" x="244" y="420">cell checks, and warnings</text>
  <rect class="dg-driver dg-r-box" x="232" y="468" width="172" height="48" rx="4"/>
  <text class="dg-body" x="244" y="488">build <tspan class="dg-code">InfluenceMoments</tspan></text>
  <text class="dg-body" x="244" y="504">and then the result</text>
