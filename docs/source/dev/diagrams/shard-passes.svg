<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 880 556" role="img" aria-labelledby="dg-passes-title dg-passes-desc">
  <title id="dg-passes-title">Passes over the shards</title>
  <desc id="dg-passes-desc">The driver sends one kernel per pass to every shard. Each shard returns one row of sums. The logit passes repeat until the deviance settles.</desc>
