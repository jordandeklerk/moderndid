  <text class="dg-code" x="522" y="118" text-anchor="middle">summary_kernel</text>
  <text class="dg-note" x="522" y="170" text-anchor="middle">counts, weight sums, (<tspan class="dg-math">R</tspan>, <tspan class="dg-math">Q</tspan>′<tspan class="dg-math">B</tspan>) of each fit</text>
  <text class="dg-code" x="522" y="202" text-anchor="middle">irls_kernel</text>
  <text class="dg-note" x="522" y="254" text-anchor="middle">(<tspan class="dg-math">R</tspan>, <tspan class="dg-math">Q</tspan>′<tspan class="dg-math">z</tspan>) and the deviance</text>
  <text class="dg-code" x="522" y="334" text-anchor="middle">cell_sums_kernel</text>
  <text class="dg-note" x="522" y="386" text-anchor="middle">totals and covariate products</text>
  <text class="dg-code" x="522" y="418" text-anchor="middle">moments_kernel</text>
  <text class="dg-note" x="522" y="470" text-anchor="middle"><tspan class="dg-math">Z</tspan>′<tspan class="dg-math">Z</tspan> and the draws' sums</text>
  <text class="dg-driver dg-r-label" x="772" y="260">Next iteration</text>
  <text class="dg-callout" x="522" y="289" text-anchor="middle">Six of the county fit's nine passes</text>
  <rect class="dg-driver dg-tile" x="40" y="68" width="32" height="32" rx="4"/>
  <use class="dg-glyph" href="#dg-passes-sigma-32" x="40" y="68" width="32" height="32"/>
  <text class="dg-name" x="84" y="81">Driver</text>
  <text class="dg-note" x="84" y="97"><tspan class="dg-code">fit_att_gt_on_shards</tspan></text>
