  <title id="dg-draws-title">Keyed bootstrap draws</title>
  <desc id="dg-draws-desc">Philox4x32-10 turns the seed, the block of a draw, and the 64-bit key of a unit, cluster, or row into 128 bits. Each draw takes its sign from one of those bits. No input depends on the partition or the task.</desc>
