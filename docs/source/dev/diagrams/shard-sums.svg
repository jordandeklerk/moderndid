<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 880 576" role="img" aria-labelledby="dg-sums-title dg-sums-desc">
  <title id="dg-sums-title">One pass over the shards</title>
  <desc id="dg-sums-desc">The prepared county panel is cut between counties into three shards. The same kernel runs on each shard and returns a partial of counts and outcome totals. The driver adds the partials and divides the totals into each year's mean outcome.</desc>
