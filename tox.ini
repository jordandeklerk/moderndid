[tox]
envlist =
    check
    docs
    {core,full}{,-coverage}
    nightly
    validation
isolated_build = True
isolated_build_env = build

[gh-actions]
python =
    3.12: coverage
    3.13: coverage
    3.14: coverage

[gh-actions:env]
TEST_SUITE =
    core: core
    full: full

[testenv:polars-floor]
description = Run core tests against the oldest polars that moderndid supports
extras =
    test
    all
# Since uv builds environments without pip, seeding keeps the pip install below working under tox-uv.
uv_seed = true
# Keep this pin at the polars floor in pyproject.toml.
commands_pre =
    python -m pip install "polars==1.38.*"
commands =
    pytest -m "not slow" -n auto --dist worksteal {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv:minimal]
description = Run core tests with no extras installed
extras =
    test
commands =
    pytest -m "not slow" -n auto --dist worksteal {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv:minimal-plots]
description = Run core tests with only the plots extra installed
extras =
    test
    plots
commands =
    pytest -m "not slow" -n auto --dist worksteal {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv:spark]
description = Run the Spark tests on a local cluster or on the Spark Connect server in MODERNDID_SPARK_REMOTE
extras =
    test
    spark
    didhonest
# Since a Spark run that skips for want of pyspark or Java would pass, a missing dependency fails here instead.
# Output capture stays on so that the Spark logs show only for failing tests.
setenv =
    PYTHONUNBUFFERED = yes
    MODERNDID_REQUIRE_ALL_DEPS = 1
commands =
    pytest tests/spark {posargs:-vv}

[testenv:spark35]
description = Run the Spark tests on PySpark 3.5 with the older numpy, pandas, and pyarrow of Databricks Runtime 16
# Because numpy below 2 has no wheel for Python 3.13 or later, the environment runs on Python 3.12.
base_python = python3.12
extras =
    test
    didhonest
# Databricks Runtime 16 runs Spark 3.5 with numpy 1.26, pandas 1.5, and pyarrow 15. Since pandas 1.5 has no wheel for
# Python 3.12, the environment pins pandas below 2.2. Like pandas 1.5, those versions have no Arrow PyCapsule interface.
deps =
    pyspark[connect]>=3.5,<3.6
    numpy<2
    pandas<2.2
    pyarrow<16
    # PySpark 3.5 imports the distutils module that Python 3.12 dropped and setuptools still provides.
    setuptools
# Since the requirements of moderndid would otherwise replace the pins above, the pins constrain those requirements too.
# This environment needs tox-uv. Pip rejects the extra in a constraint file.
constrain_package_deps = true
# Since a Spark run that skips for want of pyspark or Java would pass, a missing dependency fails here instead.
# Output capture stays on so that the Spark logs show only for failing tests.
setenv =
    PYTHONUNBUFFERED = yes
    MODERNDID_REQUIRE_ALL_DEPS = 1
# Since the conversion tests for pandas below 2.2 skip on newer pandas, they run here beside the Spark tests.
commands =
    pytest tests/spark tests/core/test_dataframe.py {posargs:-vv}

[testenv:nightly]
description = Run core tests against nightly scientific-python packages
install_command = python -I -m pip install --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple {opts} {packages}
pip_pre = true
extras =
    test
    all
commands =
    pytest -m "not slow" -n auto --dist worksteal {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv]
basepython =
    {core,full,validation,check,docs,cleandocs,viewdocs}: python3
setenv =
    PYTHONUNBUFFERED = yes
    PYTEST_EXTRA_ARGS = -s
    coverage: PYTEST_EXTRA_ARGS = --cov --cov-report xml --cov-report term
passenv =
    *
extras =
    test
    all
allowlist_externals = pytest
commands =
    pytest {env:PYTEST_MARKERS:} {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv:core]
description = Run core/fast test suite (excludes slow tests)
extras =
    test
    all
commands =
    pytest -m "not slow" -n auto --dist worksteal {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv:core-coverage]
description = Run core test suite with coverage
extras =
    test
    all
commands =
    pytest -m "not slow" -n auto --dist worksteal --cov --cov-report xml --cov-report term {posargs:-vv}

[testenv:full]
description = Run full test suite (all tests including slow ones)
extras =
    test
    all
commands =
    pytest -n auto --dist worksteal {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv:full-coverage]
description = Run full test suite with coverage
extras =
    test
    all
commands =
    pytest -n auto --dist worksteal --cov --cov-report xml --cov-report term {posargs:-vv}

[testenv:validation]
description = Run R validation tests only (requires R with did, DRDID, contdid, HonestDiD, triplediff, DIDmultiplegtDYN packages)
extras =
    test
    all
allowlist_externals = R
commands =
    R --vanilla --quiet -e "library(did); library(DRDID); library(contdid); library(HonestDiD); library(triplediff); library(DIDmultiplegtDYN); cat('R packages OK')"
    pytest tests/validation/ {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv:check]
description = perform style checks
deps =
    build
    pre-commit
skip_install = true
commands =
    pre-commit install
    pre-commit run --all-files --show-diff-on-failure
    python -m build

[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

[testenv:docs]
description = build HTML docs
setenv =
    READTHEDOCS_PROJECT = moderndid
    READTHEDOCS_VERSION = latest
extras =
    doc
    all
allowlist_externals = rm
commands =
    rm -rf "{toxworkdir}/docs_out" "{toxworkdir}/docs_doctree" "{toxworkdir}/jupyter_execute" docs/source/api/generated
    sphinx-build -d "{toxworkdir}/docs_doctree" docs/source "{toxworkdir}/docs_out" --color -v -bhtml

[testenv:cleandocs]
description = clean HTML outputs docs
skip_install = true
allowlist_externals = rm
commands =
    rm -rf "{toxworkdir}/docs_out" "{toxworkdir}/docs_doctree" "{toxworkdir}/jupyter_execute" docs/source/api/generated

[testenv:viewdocs]
description = open HTML docs
skip_install = true
commands =
    python -m webbrowser "{toxworkdir}/docs_out/index.html"
