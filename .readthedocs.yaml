# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # Page dates come from the last commit that changed each source file.
      - git fetch --unshallow || true

sphinx:
  fail_on_warning: false
  configuration: docs/source/conf.py


python:
   install:
   - method: pip
     path: .
     extra_requirements:
       - doc
       - all
