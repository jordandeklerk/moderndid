name: Full test suite
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  test-full:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} (full)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox tox-gh-actions
      - name: Run full test suite
        run: tox ${{ runner.os == 'Windows' && '-- --ignore=tests/validation -vv' || '' }}
        env:
          TEST_SUITE: full
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: ${{ matrix.os }} / Python ${{ matrix.python-version }} (full)
          fail_ci_if_error: false

  notebooks:
    name: Example notebooks (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      # The installed checkout already satisfies each notebook's pinned install.
      # That holds for a version PyPI doesn't have yet.
      - name: Install the package and the notebook runners
        run: |
          python -m pip install --upgrade pip
          pip install ".[all]" nbclient ipykernel marimo
      - name: Run the example notebooks
        run: python docs/notebooks/run_notebooks.py
