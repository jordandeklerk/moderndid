name: Run tests
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

# A new push to a pull request cancels the run it replaces. Each push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each pytest-xdist worker takes one core, so the numerical libraries get one thread each.
env:
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  VECLIB_MAXIMUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1
  NUMBA_NUM_THREADS: 1
  POLARS_MAX_THREADS: 1
  # Since the default tracer slows the suite by about a third, coverage records lines through sys.monitoring.
  COVERAGE_CORE: sysmon

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install dependencies
        run: uv pip install --system tox tox-uv tox-gh-actions
      - name: Run core test suite
        run: tox
        env:
          TEST_SUITE: core
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
          fail_ci_if_error: false

  check:
    name: Style checks and package build (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Run the pre-commit hooks and build the package
        run: tox -e check
        env:
          # Since a push to main checks out the main branch, the hook that blocks commits to main would fail.
          SKIP: no-commit-to-branch

  polars-floor:
    name: Oldest supported polars (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install dependencies
        run: uv pip install --system tox tox-uv
      - name: Run core test suite on the oldest supported polars
        run: tox -e polars-floor

  # Since every other job installs all the extras, none can catch code that imports a package a smaller install lacks.
  minimal:
    name: ${{ matrix.name }} (Python 3.14)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Core package without extras
            env: minimal
          - name: Plots extra alone
            env: minimal-plots
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install dependencies
        run: uv pip install --system tox tox-uv
      - name: Run the fast test suite
        run: tox -e ${{ matrix.env }}

  # Since a classic Spark session and a Spark Connect session can't share a process, each mode runs in a job of its own.
  # One mode per job also keeps each job short.
  spark:
    name: ${{ matrix.name }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: Spark local cluster, classic
            python: "3.13"
            java: "21"
            tox-env: spark
            remote: ""
          - name: Spark local cluster through Spark Connect
            python: "3.13"
            java: "21"
            tox-env: spark
            remote: local-cluster[2,1,1024]
          - name: PySpark 3.5 local cluster, classic
            python: "3.12"
            java: "17"
            tox-env: spark35
            remote: ""
          - name: PySpark 3.5 local cluster through Spark Connect
            python: "3.12"
            java: "17"
            tox-env: spark35
            remote: local-cluster[2,1,1024]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          # Since PyPI has pyspark only as a source archive, this cache keeps the wheel that uv builds from it.
          cache-suffix: ${{ matrix.tox-env }}
      - name: Install dependencies
        run: uv pip install --system tox tox-uv
      # Since PySpark 3.5 fetches the Spark Connect server jar from Maven Central, the cache keeps Ivy's copy between runs.
      - name: Cache the Spark Connect jar
        if: matrix.tox-env == 'spark35' && matrix.remote != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-${{ hashFiles('tox.ini') }}
          restore-keys: ivy-${{ runner.os }}-
      # An empty MODERNDID_SPARK_REMOTE starts a classic session.
      - name: Run the Spark tests on a local cluster
        run: tox -e ${{ matrix.tox-env }}
        env:
          MODERNDID_SPARK_REMOTE: ${{ matrix.remote }}

  spark-cluster:
    name: Spark standalone cluster through Spark Connect (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Since Spark Connect runs the client's Python functions on the workers, the client runs the Python of the image.
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: spark
      - name: Install dependencies
        run: uv pip install --system tox tox-uv
      - name: Start the Spark cluster
        run: docker compose -f tests/spark/cluster/compose.yaml up -d --build --wait
      - name: Run the Spark tests on the cluster
        run: tox -e spark
        env:
          MODERNDID_SPARK_REMOTE: sc://localhost:15002
      - name: Show the cluster logs
        if: failure()
        run: docker compose -f tests/spark/cluster/compose.yaml logs --no-color
      - name: Stop the Spark cluster
        if: always()
        run: docker compose -f tests/spark/cluster/compose.yaml down

  coverage:
    name: Full coverage (Python 3.14)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install dependencies
        run: uv pip install --system tox tox-uv
      - name: Run full test suite with coverage
        run: tox -e full-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: Full Coverage
          fail_ci_if_error: false
