repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    exclude: ^(uv\.lock|pixi\.lock)$
  - id: check-ast
  - id: check-merge-conflict
  - id: check-toml
  - id: check-yaml
  - id: debug-statements
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: no-commit-to-branch
    args: [--branch, main]
  - id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.1
  hooks:
    - id: ruff
      args: [ --fix, --exit-non-zero-on-fix ]
    - id: ruff-format
      types_or: [ python, pyi ]

- repo: https://github.com/MarcoGorelli/absolufy-imports
  rev: v0.3.1
  hooks:
    - id: absolufy-imports
      args: ["--application-directories", "src"]
      files: ^src/moderndid/.+\.py$

- repo: https://github.com/MarcoGorelli/madforhooks
  rev: 0.4.1
  hooks:
    - id: no-print-statements
      # Command-line scripts report progress on stdout.
      exclude: ^(benchmarks/|docs/notebooks/(make|run)_notebooks\.py$|docs/source/r_comparisons/run_r_examples\.py$)

- repo: local
  hooks:
    - id: make-notebooks
      name: write the runnable notebooks
      entry: python docs/notebooks/make_notebooks.py
      language: python
      additional_dependencies: [jupytext==1.19.6, nbformat==5.11.1]
      # Any docs source triggers the hook because a page, a label it links to, or the version can change a notebook.
      # Listing docs/notebooks/ covers the script and lets the rerun undo a hand edit to a generated notebook.
      files: ^(docs/source/|docs/notebooks/|moderndid/_version\.py$)
      pass_filenames: false
