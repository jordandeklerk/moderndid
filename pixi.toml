[workspace]
authors = ["Jordan de Klerk <jordan.deklerk@gmail.com>"]
description = "Scalable, GPU-accelerated difference-in-differences for Python."
channels = ["conda-forge"]
name = "moderndid"
platforms = ["linux-64", "osx-arm64", "osx-64"]
version = "0.1.1"

[tasks]

[dependencies]
numpy = ">=1.22.0"
scipy = ">=1.17"
polars = ">=1.0.0"
pyarrow = ">=8.0.0"
narwhals = ">=1.13.3"
statsmodels = ">=0.14.4"
prettytable = ">=3.10.0"

[feature.dev]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[feature.dev.dependencies]
pytest = ">=7.0.0"
pytest-benchmark = ">=4.0.0"
pytest-cov = ">=4.0.0"
pytest-timeout = ">=2.0.0"

[feature.dev.tasks]
tests-core = "pytest -m 'not slow' -vv"
tests-full = "pytest -vv"

[feature.benchmark.dependencies]
python = "3.12.*"
asv = ">=0.6.6,<0.7"
asv_runner = "==0.3.1"
spin = ">=0.18,<0.19"
python-build = ">=1.2.2"
pytest = ">=7.0.0"

[feature.benchmark.activation.env]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"
NUMBA_NUM_THREADS = "1"
POLARS_MAX_THREADS = "1"

[feature.benchmark.tasks]
bench = "spin bench"
benchmark-r = "spin compare"
benchmark-check = "spin asv check -E existing"
benchmark-machine = "spin asv machine --yes"
benchmark-run = "spin asv run --show-stderr"

[feature.docs]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[feature.docs.dependencies]
numpy = ">=1.22.0,<2.4"
sphinx = ">=8,<9"
sphinx-copybutton = "*"
sphinx-design = "*"
numpydoc = "*"
jupyter-sphinx = "*"

[feature.docs.pypi-dependencies]
sphinx-immaterial = ">=0.13.9"
ipython = ">=8.0"
matplotlib = ">=3.7.0"
myst-parser = { version = ">=2.0.0", extras = ["linkify"] }
myst-nb = ">=1.0.0"
tqdm = ">=4.0.0"
seaborn = ">=0.13.0"
great-tables = ">=0.15.0"

[feature.docs.tasks]
docs = "sphinx-build -E -a --keep-going -d docs/_doctree docs/source docs/_build/html --color -bhtml"
docs-open = { cmd = "python -c \"import functools, http.server, threading, webbrowser; threading.Timer(0.8, lambda: webbrowser.open('http://127.0.0.1:8765')).start(); handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory='docs/_build/html'); print('serving docs at http://127.0.0.1:8765, stop with ctrl-c'); http.server.HTTPServer(('127.0.0.1', 8765), handler).serve_forever()\"", depends-on = [
  "docs",
] }
docs-serve = { cmd = "python -m http.server 8765 --directory docs/_build/html --bind 127.0.0.1", depends-on = [
  "docs",
] }
docs-clean = "rm -rf docs/_build docs/_doctree"

[feature.etwfe.pypi-dependencies]
pyfixest = ">=0.30.2"

[feature.didcont.pypi-dependencies]
formulaic = ">=1.1.0"

[feature.didhonest.pypi-dependencies]
cvxpy = { version = ">=1.3.0", extras = ["ECOS"] }

[feature.didml.pypi-dependencies]
scikit-learn = ">=1.3.0"
cvxpy = { version = ">=1.3.0", extras = ["ECOS"] }
econml = ">=0.15.0"
xgboost = ">=2.0.0"
formulaic = ">=1.1.0"

[feature.plots.pypi-dependencies]
plotnine = ">=0.14.0"

[feature.numba.dependencies]
numba = ">=0.57.0"

[feature.gpu]
platforms = ["linux-64"]

[feature.gpu.pypi-dependencies]
cupy-cuda12x = ">=13.0"

[feature.lint.dependencies]
pre-commit = ">=3.0.0"

[feature.lint.pypi-dependencies]
ruff = ">=0.11.7"
mypy = ">=1.0.0"

[feature.lint.tasks]
lint = "pre-commit run --all-files"

[feature.build.dependencies]
pip = "*"
flit = ">=3.4,<4"

[feature.build.pypi-dependencies]
moderndid = { path = ".", editable = true }

[feature.build.tasks]
package = "flit build"

[feature.validation]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[feature.validation.dependencies]
r-base = "*"
r-did = "*"
r-drdid = "*"
r-jsonlite = "*"
glpk = "*"

# Since R 4.3.3 links Fortran code against gfortran 14.3's libraries, a newer gfortran breaks source installs.
[feature.validation.target.osx-arm64.dependencies]
gfortran_osx-arm64 = "14.3.*"

[feature.validation.tasks]
setup-r = "bash .github/scripts/setup-r.sh"
all = "pytest tests/validation/ -vv"
did = "pytest tests/validation/test_r_did.py -vv"
didcont = "pytest tests/validation/test_r_didcont.py -vv"
drdid = "pytest tests/validation/test_r_drdid.py -vv"
didinter = "pytest tests/validation/test_r_didinter.py -vv"
didtriple = "pytest tests/validation/test_r_didtriple.py -vv"
didhonest = "pytest tests/validation/test_r_didhonest.py -vv"
npiv = "pytest tests/validation/test_r_npiv.py -vv"

[environments]
benchmark = { features = ["benchmark", "build", "didcont", "numba", "validation"], solve-group = "benchmark" }
dev = ["dev", "build", "etwfe", "didcont", "didhonest", "didml", "plots", "numba"]
docs = ["docs", "build", "etwfe", "didcont", "didhonest", "didml", "plots", "numba"]
check = ["lint"]
build = ["build"]
gpu = ["gpu"]
validation = ["dev", "build", "etwfe", "validation", "didcont", "didhonest", "plots", "numba"]
